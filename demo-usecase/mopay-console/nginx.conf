worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  access_log    /dev/stdout;
  sendfile      on;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 512;

  # Writable paths, so the container can run with a read-only root filesystem.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    location /healthz {
      add_header Content-Type application/json;
      return 200 '{"status":"ok","service":"mopay-console"}';
    }

    # Runtime configuration, written by docker-entrypoint.sh at container start.
    # Never cached: a stale config.js would point the console at the wrong environment.
    location = /config.js {
      alias /tmp/config.js;
      default_type application/javascript;
      add_header Cache-Control "no-store";
    }

    # Single-page app: unknown paths fall through to the shell.
    location / { try_files $uri $uri/ /index.html; }

    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }
  }
}
